# Supabase local config — https://supabase.com/docs/reference/cli/config
[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Le projet distant (niuuropuwxefctoulpml) tourne en PostgreSQL 17.
# Un local en 15 ferait passer des migrations qui echoueraient en ligne.
major_version = 17

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["https://localhost:8081", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[realtime]
enabled = true

[analytics]
enabled = false

# ── Edge Functions ────────────────────────────────────────────────
# `verify_jwt = false` uniquement pour le webhook : l'appelant est
# l'operateur de paiement, pas un utilisateur connecte. Son
# authentification repose sur une signature HMAC verifiee dans la
# fonction elle-meme (§22).

[functions.ai-proxy]
verify_jwt = true

[functions.payment-init]
verify_jwt = true

[functions.payment-webhook]
verify_jwt = false
